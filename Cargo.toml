[workspace]
resolver = "3"
members = ["crates/trackdo-server"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.87"
license = "MIT"
repository = "https://github.com/Syu-fu/trackdo-server"
publish = false

[workspace.dependencies]
trackdo-core = { git = "https://github.com/Syu-fu/trackdo-core", tag = "v0.2.0" }
trackdo-protocol = { git = "https://github.com/Syu-fu/trackdo-core", tag = "v0.2.0" }
sqlx = { version = "0.8.6", default-features = false, features = ["runtime-tokio", "sqlite", "macros", "migrate"] }
thiserror = "2"
tokio = "1"
proptest = "1"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
