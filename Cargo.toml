[workspace]
resolver = "3"
members = ["crates/trackdo-server"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.87"
license = "MIT"
repository = "https://github.com/Syu-fu/trackdo-server"
publish = false

[workspace.dependencies]
trackdo-core = { git = "https://github.com/Syu-fu/trackdo-core", tag = "v0.2.0" }
trackdo-protocol = { git = "https://github.com/Syu-fu/trackdo-core", tag = "v0.2.0" }
sqlx = { version = "0.8.6", default-features = false, features = ["runtime-tokio", "sqlite", "macros", "migrate"] }
thiserror = "2"
axum = "0.8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
subtle = "2"
tracing = "0.1"
tower = "0.5"
futures-util = { version = "0.3", default-features = false }
http-body-util = "0.1"
tokio-util = "0.7"
tower-http = { version = "0.6", features = ["cors"] }
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
uuid = { version = "1", default-features = false, features = ["serde"] }
tokio = "1"
proptest = "1"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
